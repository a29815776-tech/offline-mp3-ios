name: OfflineMP3
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  OfflineMP3:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.offlinemp3.player
        SWIFT_VERSION: "5.0"
    info:
      path: Build/Info.plist
      properties:
        CFBundleDisplayName: 離線 MP3
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio

